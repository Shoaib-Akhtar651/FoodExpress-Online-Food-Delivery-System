<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Details - FoodExpress</title>

    <link rel="stylesheet"
          href="/css/style.css">

    <style>

        body {
            background: #f7f7f7;
        }

        .details-section {
            min-height: 650px;
            padding: 60px 30px;
        }

        .details-container {
            max-width: 1050px;
            margin: 0 auto;

            background: white;

            border-radius: 15px;

            padding: 35px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 45px;

            align-items: center;
        }

        .details-image-container {
            width: 100%;
            min-height: 400px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fafafa;

            border-radius: 12px;

            overflow: hidden;
        }

        .details-image {
            width: 100%;
            height: 400px;

            object-fit: contain;

            display: block;
        }

        .image-message {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        .details-content h1 {
            font-size: 38px;
            margin-bottom: 18px;
        }

        .details-description {
            color: #666;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .details-price {
            color: #e63946;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .availability {
            font-weight: bold;
            margin-bottom: 25px;
        }

        .available {
            color: green;
        }

        .not-available {
            color: red;
        }

        .quantity-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .quantity-box button {
            width: 42px;
            height: 42px;

            border: none;

            background: #eeeeee;

            border-radius: 7px;

            font-size: 24px;

            cursor: pointer;
        }

        .quantity-box button:hover {
            background: #dddddd;
        }

        .quantity-box span {
            min-width: 35px;

            text-align: center;

            font-size: 20px;

            font-weight: bold;
        }

        .total-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            border-top: 1px solid #eeeeee;

            border-bottom: 1px solid #eeeeee;

            padding: 18px 0;

            margin-bottom: 25px;

            font-size: 20px;

            font-weight: bold;
        }

        .total-value {
            color: #e63946;
        }

        .action-row {
            display: flex;

            gap: 15px;

            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;

            min-width: 180px;

            border: none;

            padding: 15px 20px;

            border-radius: 8px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            color: white;
        }

        .cart-btn {
            background: #222;
        }

        .cart-btn:hover {
            background: #000;
        }

        .order-btn {
            background: #e63946;
        }

        .order-btn:hover {
            background: #c92f3b;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;

            text-align: center;

            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .loading {
            text-align: center;

            font-size: 18px;

            color: #666;
        }

        @media (max-width: 800px) {

            .details-container {
                grid-template-columns: 1fr;
            }

            .details-image-container {
                min-height: 300px;
            }

            .details-image {
                height: 300px;
            }

            .details-content h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


   
    <header class="navbar">

        <div class="logo">
            FoodExpress
        </div>


        <nav class="nav-links">

            <a href="/dashboard.html">
                Home
            </a>

            <a href="/dashboard.html#restaurants">
                Restaurants
            </a>

            <a href="/cart.html">
                Cart
            </a>

            <a href="/order.html">
                Orders
            </a>

            <a href="#"
               onclick="logout(); return false;">
                Logout
            </a>

        </nav>

    </header>




    <main>

        <section class="details-section">

            <div class="details-container">



                <div class="details-image-container">

                    <img
                        id="foodImage"
                        class="details-image"
                        alt="Food photo"
                        style="display: none;"
                    >

                    <div
                        id="imageMessage"
                        class="image-message"
                    >
                        Loading food photo...
                    </div>

                </div>




                <div class="details-content">


                    <h1 id="foodName">
                        Loading...
                    </h1>


                    <p
                        id="foodDescription"
                        class="details-description"
                    >
                        Loading...
                    </p>


                    <p
                        id="foodPrice"
                        class="details-price"
                    >
                        ₹0.00
                    </p>


                    <div
                        id="availability"
                        class="availability"
                    >
                    </div>



                 

                    <div class="quantity-title">
                        Quantity
                    </div>


                    <div class="quantity-box">

                        <button
                            type="button"
                            onclick="changeQuantity(-1)"
                        >
                            −
                        </button>


                        <span id="quantity">
                            1
                        </span>


                        <button
                            type="button"
                            onclick="changeQuantity(1)"
                        >
                            +
                        </button>

                    </div>



                   

                    <div class="total-row">

                        <span>
                            Total
                        </span>


                        <span
                            id="total"
                            class="total-value"
                        >
                            ₹0.00
                        </span>

                    </div>



                 

                    <div class="action-row">


                        <button
                            id="addCartButton"
                            class="action-btn cart-btn"
                            type="button"
                            onclick="addSelectedToCart(false)"
                        >
                            🛒 Add to Cart
                        </button>


                        <button
                            id="orderButton"
                            class="action-btn order-btn"
                            type="button"
                            onclick="addSelectedToCart(true)"
                        >
                            ⚡ Order Now
                        </button>

                    </div>


                    <div
                        id="status"
                        class="status"
                    >
                    </div>


                </div>

            </div>

        </section>

    </main>




    <script>

        "use strict";


       
        const token =
            localStorage.getItem("token");


        const userId =
            localStorage.getItem("userId");


        if (!token || !userId) {

            window.location.href =
                "/login.html";

        }



       

        const params =
            new URLSearchParams(
                window.location.search
            );


        const foodId =
            params.get("id");


        const restaurantId =
            params.get("restaurantId");


        let food = null;


        let quantity = 1;




        function logout() {

            localStorage.removeItem("token");

            localStorage.removeItem("userId");

            localStorage.removeItem("userName");

            localStorage.removeItem("userEmail");

            window.location.href =
                "/login.html";

        }



        

        function setStatus(
            message,
            type
        ) {

            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                message;


            status.className =
                "status " + type;

        }



      

        function changeQuantity(change) {

            quantity += change;


            if (quantity < 1) {

                quantity = 1;

            }


            if (quantity > 20) {

                quantity = 20;

            }


            document.getElementById(
                "quantity"
            ).textContent =
                quantity;


            updateTotal();

        }




        function updateTotal() {

            if (!food) {

                return;

            }


            const total =
                Number(food.price) *
                quantity;


            document.getElementById(
                "total"
            ).textContent =
                "₹" +
                total.toFixed(2);

        }



        

        async function loadFood() {

            try {

                if (!foodId) {

                    throw new Error(
                        "Food ID is missing."
                    );

                }


                if (!restaurantId) {

                    throw new Error(
                        "Restaurant ID is missing."
                    );

                }


                const response =
                    await fetch(
                        "/api/foods/restaurant/" +
                        encodeURIComponent(
                            restaurantId
                        ),
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " +
                                    token
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load food."
                    );

                }


                const foods =
                    await response.json();


                food =
                    foods.find(
                        function(item) {

                            return String(
                                item.id
                            ) === String(
                                foodId
                            );

                        }
                    );


                if (!food) {

                    throw new Error(
                        "Food not found."
                    );

                }


                displayFood();


            } catch (error) {

                console.error(
                    "Food loading error:",
                    error
                );


                document.getElementById(
                    "foodName"
                ).textContent =
                    "Food not found";


                document.getElementById(
                    "foodDescription"
                ).textContent =
                    error.message;


                setStatus(
                    error.message,
                    "error"
                );

            }

        }



        

        function displayFood() {

            document.getElementById(
                "foodName"
            ).textContent =
                food.name;


            document.getElementById(
                "foodDescription"
            ).textContent =
                food.description ||
                "Delicious food from FoodExpress.";


            document.getElementById(
                "foodPrice"
            ).textContent =
                "₹" +
                Number(
                    food.price
                ).toFixed(2);



           

            const availability =
                document.getElementById(
                    "availability"
                );


            if (food.available) {

                availability.textContent =
                    "✓ Available";

                availability.className =
                    "availability available";

            } else {

                availability.textContent =
                    "✕ Currently Unavailable";

                availability.className =
                    "availability not-available";

                document.getElementById(
                    "addCartButton"
                ).disabled = true;


                document.getElementById(
                    "orderButton"
                ).disabled = true;

            }



            updateTotal();


            loadFoodImage();

        }




        async function loadFoodImage() {

            const image =
                document.getElementById(
                    "foodImage"
                );


            const message =
                document.getElementById(
                    "imageMessage"
                );



            if (food.imageUrl) {

                image.src =
                    food.imageUrl;

                image.onload =
                    function() {

                        image.style.display =
                            "block";

                        message.style.display =
                            "none";

                    };

                image.onerror =
                    function() {

                        image.style.display =
                            "none";

                        message.textContent =
                            "Food photo unavailable.";

                    };

                return;

            }



         

            const exactFiles = {

                "palak paneer":
                    "Palak_Paneer.JPG",

                "paneer butter masala":
                    "Paneer_Butter_Masala.jpg",

                "matar paneer":
                    "Matar_paneer.jpg",

                "dal fry":
                    "DAAL_FRY.JPG"

            };


            const name =
                String(
                    food.name || ""
                )
                .trim()
                .toLowerCase();


            if (exactFiles[name]) {

                const url =
                    "https://commons.wikimedia.org/wiki/Special:Redirect/file/" +
                    encodeURIComponent(
                        exactFiles[name]
                    );


                image.src = url;


                image.onload =
                    function() {

                        image.style.display =
                            "block";

                        message.style.display =
                            "none";

                    };


                image.onerror =
                    function() {

                        image.style.display =
                            "none";

                        message.textContent =
                            "Exact food photo unavailable.";

                    };


                return;

            }



           

            try {

                const response =
                    await fetch(
                        "https://www.themealdb.com/api/json/v1/1/search.php?s=" +
                        encodeURIComponent(
                            food.name
                        )
                    );


                if (response.ok) {

                    const data =
                        await response.json();


                    if (
                        data.meals &&
                        data.meals.length > 0
                    ) {

                        const exactMeal =
                            data.meals.find(
                                function(meal) {

                                    return (
                                        String(
                                            meal.strMeal
                                        )
                                        .trim()
                                        .toLowerCase() ===
                                        name
                                    );

                                }
                            );


                        if (exactMeal) {

                            image.src =
                                exactMeal.strMealThumb;


                            image.onload =
                                function() {

                                    image.style.display =
                                        "block";

                                    message.style.display =
                                        "none";

                                };


                            image.onerror =
                                function() {

                                    image.style.display =
                                        "none";

                                    message.textContent =
                                        "Exact food photo unavailable.";

                                };


                            return;

                        }

                    }

                }

            } catch (error) {

                console.log(
                    "Exact image search unavailable."
                );

            }



        

            image.style.display =
                "none";


            message.textContent =
                "Exact food photo unavailable.";

        }



       

        async function addSelectedToCart(
            orderNow
        ) {

            if (!food) {

                setStatus(
                    "Food information is not available.",
                    "error"
                );

                return;

            }


            if (!food.available) {

                setStatus(
                    "This food is currently unavailable.",
                    "error"
                );

                return;

            }



            const cartButton =
                document.getElementById(
                    "addCartButton"
                );


            const orderButton =
                document.getElementById(
                    "orderButton"
                );


            try {

             

                cartButton.disabled =
                    true;

                orderButton.disabled =
                    true;




                if (orderNow) {

                    orderButton.textContent =
                        "Placing Order...";



                    const subtotal =
                        Number(food.price) *
                        quantity;


                    const orderItem = {

                        foodId:
                            food.id,

                        foodName:
                            food.name,

                        price:
                            Number(food.price),

                        quantity:
                            quantity,

                        subtotal:
                            subtotal

                    };


                   

                    const order = {

                        userId:
                            userId,

                        items:
                            [
                                orderItem
                            ],

                        totalAmount:
                            subtotal,

                        status:
                            "PENDING",

                        deliveryAddress:
                            null

                    };


                 

                    const response =
                        await fetch(
                            "/api/orders",
                            {
                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " +
                                        token

                                },

                                body:
                                    JSON.stringify(
                                        order
                                    )

                            }
                        );


                    if (!response.ok) {

                        let errorMessage =
                            "Unable to place order.";


                        try {

                            const errorData =
                                await response.json();


                            if (
                                errorData.message
                            ) {

                                errorMessage =
                                    errorData.message;

                            }

                        } catch (e) {

                            const text =
                                await response.text();


                            if (text) {

                                errorMessage =
                                    text;

                            }

                        }


                        throw new Error(
                            errorMessage
                        );

                    }


                    const createdOrder =
                        await response.json();


                  
                    localStorage.setItem(
                        "selectedOrderId",
                        createdOrder.id
                    );


                    localStorage.setItem(
                        "selectedOrderAmount",
                        createdOrder.totalAmount
                    );


                   
                    setStatus(
                        "Order placed successfully! Order ID: " +
                        createdOrder.id,
                        "success"
                    );


                 

                    setTimeout(
                        function() {

                            window.location.href =
                                "/order.html";

                        },
                        700
                    );


                    return;

                }



              

                cartButton.textContent =
                    "Adding...";


                const cartResponse =
                    await fetch(
                        "/api/carts/user/" +
                        encodeURIComponent(
                            userId
                        ),
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " +
                                    token
                            }
                        }
                    );


                let cart = null;


               

                if (
                    cartResponse.ok
                ) {

                    cart =
                        await cartResponse.json();

                }




                if (!cart) {

                    cart = {

                        userId:
                            userId,

                        items:
                            [],

                        totalAmount:
                            0

                    };

                }



               
                const existingItem =
                    cart.items.find(
                        function(item) {

                            return String(
                                item.foodId
                            ) === String(
                                food.id
                            );

                        }
                    );



                if (existingItem) {

                    existingItem.quantity +=
                        quantity;

                } else {

                    cart.items.push({

                        foodId:
                            food.id,

                        foodName:
                            food.name,

                        price:
                            Number(food.price),

                        quantity:
                            quantity

                    });

                }



              
                cart.totalAmount =
                    cart.items.reduce(
                        function(sum, item) {

                            return sum +
                                (
                                    Number(
                                        item.price
                                    ) *
                                    Number(
                                        item.quantity
                                    )
                                );

                        },
                        0
                    );



                let updateResponse;



               

                if (cart.id) {

                    updateResponse =
                        await fetch(
                            "/api/carts/" +
                            encodeURIComponent(
                                cart.id
                            ),
                            {
                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " +
                                        token

                                },

                                body:
                                    JSON.stringify(
                                        cart
                                    )

                            }
                        );

                } else {

                    

                    updateResponse =
                        await fetch(
                            "/api/carts",
                            {
                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " +
                                        token

                                },

                                body:
                                    JSON.stringify(
                                        cart
                                    )

                            }
                        );

                }



                if (!updateResponse.ok) {

                    throw new Error(
                        "Unable to add food to cart."
                    );

                }



                setStatus(
                    food.name +
                    " added to cart successfully!",
                    "success"
                );


                cartButton.textContent =
                    "✓ Added to Cart";


                setTimeout(
                    function() {

                        window.location.href =
                            "/cart.html";

                    },
                    700
                );



            } catch (error) {

                console.error(
                    "Cart/Order error:",
                    error
                );


                setStatus(
                    error.message ||
                    "Unable to complete request.",
                    "error"
                );


                cartButton.disabled =
                    false;

                orderButton.disabled =
                    false;


                cartButton.textContent =
                    "🛒 Add to Cart";


                orderButton.textContent =
                    "⚡ Order Now";

            }

        }



       

        loadFood();

    </script>


</body>

</html>
