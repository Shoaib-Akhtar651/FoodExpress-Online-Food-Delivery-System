<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Cart - FoodExpress</title>

    <link rel="stylesheet"
          href="/css/style.css">

    <style>

        .cart-section {
            padding: 60px 30px;
            min-height: 600px;
        }

        .cart-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .cart-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .cart-item {
            background: white;
            padding: 25px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .cart-item-info h3 {
            margin-bottom: 10px;
        }

        .cart-item-info p {
            color: #666;
            margin: 5px 0;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity-number {
            font-size: 18px;
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-summary {
            background: white;
            padding: 25px;
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            text-align: right;
        }

        .cart-total {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 10px;
        }

        .empty-cart h2 {
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: #666;
        }

        .error-message {
            text-align: center;
            color: red;
            font-size: 17px;
        }

        .success-message {
            text-align: center;
            color: green;
            font-size: 17px;
            margin-top: 15px;
            font-weight: bold;
        }

        .placing-order {
            opacity: 0.7;
            pointer-events: none;
        }

        @media (max-width: 700px) {

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>



    <header class="navbar">

        <div class="logo">
            FoodExpress
        </div>

        <nav class="nav-links">

            <a href="/dashboard.html">
                Home
            </a>

            <a href="/dashboard.html#restaurants">
                Restaurants
            </a>

            <a href="/cart.html">
                Cart
            </a>

            <a href="/order.html">
                Orders
            </a>

            <a href="#"
               onclick="logout(); return false;">
                Logout
            </a>

        </nav>

    </header>



  

    <section class="cart-section">

        <div class="cart-container">


            <div class="cart-title">

                <h1>
                    🛒 My Cart
                </h1>

                <p>
                    Review your selected food items
                </p>

            </div>



       

            <div id="cartContainer">

                <p class="loading">
                    Loading your cart...
                </p>

            </div>



         

            <div id="cartSummary"
                 style="display: none;">

                <div class="cart-summary">

                    <div class="cart-total">

                        Total:
                        ₹<span id="totalAmount">0</span>

                    </div>


                    <a href="#"
                       id="placeOrderButton"
                       class="btn btn-primary"
                       onclick="placeOrder(); return false;">

                        Proceed to Order

                    </a>


                    <div id="orderMessage"></div>

                </div>

            </div>


        </div>

    </section>



    

    <footer class="footer">

        <p>
            © 2026 FoodExpress. All Rights Reserved.
        </p>

    </footer>



    <script>


     

        const token =
            localStorage.getItem("token");

        const userId =
            localStorage.getItem("userId");


        

        if (!token || !userId) {

            window.location.href =
                "/login.html";

        }



        function logout() {

            localStorage.removeItem("token");

            localStorage.removeItem("userId");

            localStorage.removeItem("userName");

            localStorage.removeItem("userEmail");

            window.location.href =
                "/login.html";

        }




        async function loadCart() {

            const container =
                document.getElementById(
                    "cartContainer"
                );


            try {

                const response =
                    await fetch(
                        "/api/carts/user/" +
                        encodeURIComponent(userId),
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                

                if (response.status === 404) {

                    showEmptyCart();

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to load cart"
                    );

                }


                const cart =
                    await response.json();



                if (
                    !cart ||
                    !cart.items ||
                    cart.items.length === 0
                ) {

                    showEmptyCart();

                    return;

                }


                displayCart(cart);


            } catch (error) {

                container.innerHTML = `

                    <div class="error-message">

                        Unable to load your cart.

                    </div>

                `;

                console.error(error);

            }

        }




        function showEmptyCart() {

            const container =
                document.getElementById(
                    "cartContainer"
                );


            document.getElementById(
                "cartSummary"
            ).style.display = "none";


            container.innerHTML = `

                <div class="empty-cart">

                    <h2>
                        Your cart is empty 🛒
                    </h2>

                    <p>
                        Add some delicious food
                        to your cart.
                    </p>

                    <br>

                    <a
                        href="/dashboard.html#restaurants"
                        class="btn btn-primary"
                    >
                        Explore Restaurants
                    </a>

                </div>

            `;

        }




        function displayCart(cart) {

            const container =
                document.getElementById(
                    "cartContainer"
                );


            container.innerHTML = "";


            cart.items.forEach(
                function(item, index) {

                    const itemDiv =
                        document.createElement(
                            "div"
                        );


                    itemDiv.className =
                        "cart-item";


                    const itemTotal =
                        Number(item.price) *
                        Number(item.quantity);


                    itemDiv.innerHTML = `

                        <div class="cart-item-info">

                            <h3>
                                ${escapeHtml(item.foodName)}
                            </h3>

                            <p>
                                Price:
                                ₹${Number(item.price).toFixed(2)}
                            </p>

                            <p>
                                Item Total:
                                ₹${itemTotal.toFixed(2)}
                            </p>

                        </div>


                        <div class="quantity-control">

                            <button
                                class="quantity-btn"
                                type="button"
                                onclick="
                                    changeQuantity(
                                        ${index},
                                        -1
                                    )
                                "
                            >
                                -
                            </button>


                            <span class="quantity-number">
                                ${item.quantity}
                            </span>


                            <button
                                class="quantity-btn"
                                type="button"
                                onclick="
                                    changeQuantity(
                                        ${index},
                                        1
                                    )
                                "
                            >
                                +
                            </button>

                        </div>


                        <button
                            class="remove-btn"
                            type="button"
                            onclick="
                                removeItem(${index})
                            "
                        >
                            Remove
                        </button>

                    `;


                    container.appendChild(
                        itemDiv
                    );

                }
            );


            document.getElementById(
                "totalAmount"
            ).innerText =
                Number(cart.totalAmount).toFixed(2);


            document.getElementById(
                "cartSummary"
            ).style.display = "block";


        

            window.currentCart = cart;

        }



        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value == null ? "" : String(value);

            return div.innerHTML;

        }




        async function changeQuantity(
            index,
            change
        ) {

            const cart =
                window.currentCart;


            if (!cart || !cart.items) {

                return;

            }


            const item =
                cart.items[index];


            if (!item) {

                return;

            }


            item.quantity += change;



            if (item.quantity <= 0) {

                cart.items.splice(
                    index,
                    1
                );

            }


            await updateCart(cart);

        }



        async function removeItem(index) {

            const cart =
                window.currentCart;


            if (!cart || !cart.items) {

                return;

            }


            cart.items.splice(
                index,
                1
            );


            await updateCart(cart);

        }



        async function updateCart(cart) {

           

            let total = 0;


            cart.items.forEach(
                function(item) {

                    total +=
                        Number(item.price) *
                        Number(item.quantity);

                }
            );


            cart.totalAmount =
                total;


          

            if (cart.items.length === 0) {

                try {

                    const response =
                        await fetch(
                            "/api/carts/" +
                            cart.id,
                            {
                                method: "DELETE",

                                headers: {
                                    "Authorization":
                                        "Bearer " +
                                        token
                                }
                            }
                        );


                    if (
                        !response.ok &&
                        response.status !== 404
                    ) {

                        throw new Error(
                            "Unable to delete cart"
                        );

                    }

                } catch (error) {

                    console.error(error);

                }


                showEmptyCart();

                return;

            }



            try {

                const response =
                    await fetch(
                        "/api/carts/" +
                        cart.id,
                        {
                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token

                            },

                            body:
                                JSON.stringify({

                                    userId:
                                        cart.userId,

                                    items:
                                        cart.items,

                                    totalAmount:
                                        cart.totalAmount

                                })

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Cart update failed"
                    );

                }


                const updatedCart =
                    await response.json();


                displayCart(
                    updatedCart
                );


            } catch (error) {

                alert(
                    "Unable to update cart."
                );

                console.error(error);

                loadCart();

            }

        }



       

        async function placeOrder() {

            const cart =
                window.currentCart;


            
            if (
                !cart ||
                !cart.items ||
                cart.items.length === 0
            ) {

                alert(
                    "Your cart is empty."
                );

                return;

            }


            const button =
                document.getElementById(
                    "placeOrderButton"
                );


            const message =
                document.getElementById(
                    "orderMessage"
                );


            try {


                button.classList.add(
                    "placing-order"
                );

                button.innerText =
                    "Placing Order...";


                message.innerHTML = "";


              

                const response =
                    await fetch(
                        "/api/orders/from-cart/" +
                        encodeURIComponent(userId),
                        {
                            method: "POST",

                            headers: {

                                "Authorization":
                                    "Bearer " +
                                    token

                            }

                        }
                    );


                if (!response.ok) {

                    let errorMessage =
                        "Unable to place order.";


                    try {

                        const errorData =
                            await response.json();


                        if (
                            errorData.message
                        ) {

                            errorMessage =
                                errorData.message;

                        }

                    } catch (e) {

                        const text =
                            await response.text();

                        if (text) {

                            errorMessage =
                                text;

                        }

                    }


                    throw new Error(
                        errorMessage
                    );

                }


                const order =
                    await response.json();


             

                message.innerHTML = `

                    <div class="success-message">

                        Order placed successfully! 🎉

                        <br>

                        Order ID:
                        ${escapeHtml(order.id)}

                    </div>

                `;


                

                window.currentCart =
                    null;


               

                setTimeout(
                    function() {

                        window.location.href =
                            "/order.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Order error:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to place order. Please try again."
                );


                button.classList.remove(
                    "placing-order"
                );


                button.innerText =
                    "Proceed to Order";

            }

        }




        loadCart();


    </script>


</body>

</html>
